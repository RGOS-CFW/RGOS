name: Build RGOS image or update

on:
  workflow_dispatch:
    inputs:
      device:
        description: Which device to build for
        required: true
        type: choice
        options:
          - rg34xxsp
          - rg35xxh
          - rg35xxsp
          - rg-rotate
          - all
        default: rg34xxsp
      artifact:
        description: What to build
        required: true
        type: choice
        options:
          - img
          - installer
          - update-tar
        default: img
      build_id:
        description: Optional build ID (blank uses UTC timestamp)
        required: false
        type: string
        default: ''
      build_psx:
        description: build the PlayStation core from source (slow under emulation; off skips it)
        required: true
        type: boolean
        default: true
      build_gc:
        description: RG Rotate only - build the GameCube core (Dolphin libretro) from source (very slow under emulation; off skips it)
        required: true
        type: boolean
        default: true
      update_extlinux:
        description: update-tar only - also include extlinux.conf in the update
        required: true
        type: boolean
        default: false
      h700_ram:
        description: RG34XXSP / RG35XX H / RG35XX SP only - RAM type of the console (the stock ROCKNIX U-Boot is built per RAM type; the wrong one gives a black screen and no boot)
        required: true
        type: choice
        options:
          - DDR4
          - DDR3
        default: DDR4
      h700_panel:
        description: RG34XXSP / RG35XX H / RG35XX SP only - device tree to use (alt = the -v2-panel / -rev6-panel tree; pick it if the screen stays black or shows garbage)
        required: true
        type: choice
        options:
          - standard
          - alt
        default: standard
      portmaster:
        description: preinstall PortMaster (and the libraries its LOVE runtime needs, such as libopenal1); off builds without it
        required: true
        type: boolean
        default: true
      extra_pkgs:
        description: optional extra Debian packages to install in the image, space separated (for a library a port reports as missing)
        required: false
        type: string
        default: ''
      rocknix_url:
        description: override the stock ROCKNIX image URL (blank uses the build.sh default; not allowed with device=all, the devices use different images)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: rgos-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out RGOS
        uses: actions/checkout@v4

      - name: Prepare build ID
        id: metadata
        shell: bash
        env:
          INPUT_BUILD_ID: ${{ inputs.build_id }}
          INPUT_DEVICE: ${{ inputs.device }}
          INPUT_ARTIFACT: ${{ inputs.artifact }}
          INPUT_ROCKNIX_URL: ${{ inputs.rocknix_url }}
        run: |
          set -euo pipefail
          build_id="$INPUT_BUILD_ID"
          if [[ -z "$build_id" ]]; then
            build_id="$(date -u +%Y%m%d-%H%M%S)"
          fi
          if [[ ! "$build_id" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "Invalid build ID: use 1-64 letters, digits, dots, underscores or hyphens." >&2
            exit 2
          fi
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          if [[ "$INPUT_DEVICE" == "all" && -n "$INPUT_ROCKNIX_URL" ]]; then
            echo "rocknix_url cannot be combined with device=all (each device has its own stock image)." >&2
            exit 2
          fi
          echo "Building $INPUT_DEVICE artifact: $INPUT_ARTIFACT (ID: $build_id)"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring qemu-user-static binfmt-support \
            squashfs-tools wget gdisk dosfstools e2fsprogs fdisk util-linux \
            git python3 xz-utils gzip ca-certificates
          suite="${DEBIAN_SUITE:-trixie}"
          if [[ ! -e "/usr/share/debootstrap/scripts/$suite" ]]; then
            sudo ln -s sid "/usr/share/debootstrap/scripts/$suite"
          fi
          if [[ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]]; then
            sudo update-binfmts --enable qemu-aarch64 || true
          fi
          test -e /proc/sys/fs/binfmt_misc/qemu-aarch64 || { echo "qemu-aarch64 binfmt handler is not registered" >&2; exit 1; }

      - name: Build disk image
        if: inputs.artifact == 'img'
        env:
          DEVICE: ${{ inputs.device }}
          BUILD_PSX: ${{ inputs.build_psx }}
          BUILD_GC: ${{ inputs.build_gc }}
          ROCKNIX_URL_INPUT: ${{ inputs.rocknix_url }}
          H700_RAM_INPUT: ${{ inputs.h700_ram }}
          H700_PANEL_INPUT: ${{ inputs.h700_panel }}
          PORTMASTER_INPUT: ${{ inputs.portmaster }}
          EXTRA_PKGS_INPUT: ${{ inputs.extra_pkgs }}
        run: |
          set -euo pipefail
          [[ "$PORTMASTER_INPUT" == "true" ]] && export PORTMASTER=1 || export PORTMASTER=0
          [[ -z "$EXTRA_PKGS_INPUT" ]] || export EXTRA_PKGS="$EXTRA_PKGS_INPUT"
          [[ "$BUILD_PSX" == "true" ]] || export PSX_REPO=none
          [[ "$BUILD_GC" == "true" ]] || export GC_REPO=none
          [[ -z "$ROCKNIX_URL_INPUT" ]] || export ROCKNIX_URL="$ROCKNIX_URL_INPUT"
          export H700_RAM="$H700_RAM_INPUT"
          if [[ "$H700_PANEL_INPUT" == "alt" ]]; then
            export RG34XXSP_DTB=sun50i-h700-anbernic-rg34xx-sp-v2-panel
            export RG35XXH_DTB=sun50i-h700-anbernic-rg35xx-h-rev6-panel
            export RG35XXSP_DTB=sun50i-h700-anbernic-rg35xx-sp-rev6-panel
          fi
          bash ./build.sh "$DEVICE" image
          if [[ "$DEVICE" == "all" ]]; then
            test -s out/rg-rotate-rgos.img && test -s out/rg34xxsp-rgos.img && test -s out/rg35xxh-rgos.img && test -s out/rg35xxsp-rgos.img
          else
            test -s "out/$DEVICE-rgos.img"
          fi

      - name: Verify disk image
        if: inputs.artifact == 'img'
        run: |
          set -euo pipefail
          verify() {
            local img="$1" ptable="$2" loop mnt label
            loop="$(sudo losetup -Pfr --show "$img")"
            mnt="$(mktemp -d)"
            sudo partprobe "$loop" 2>/dev/null || true
            for _ in 1 2 3 4 5; do [[ -b "${loop}p1" ]] && break; sleep 1; done
            label="$(sudo blkid -s LABEL -o value "${loop}p1")"
            [[ "$label" == "RGOS" ]] || { echo "$img: boot partition label is '$label', expected RGOS" >&2; sudo losetup -d "$loop"; return 1; }
            if [[ "$ptable" == gpt ]]; then
              sudo sgdisk -i 3 "$img" | grep -q "^Partition name: 'uboot'" \
                || { echo "$img: partition 3 is not 'uboot': the device would boot Android" >&2; sudo losetup -d "$loop"; return 1; }
            else
              sfdisk -d "$img" | grep -q '^label: dos' \
                || { echo "$img: not an MBR image" >&2; sudo losetup -d "$loop"; return 1; }
            fi
            sudo mount -o ro "${loop}p1" "$mnt"
            local rc=0 f
            for f in SYSTEM rgos-initrd.cpio extlinux/extlinux.conf extlinux/extlinux.conf.stock; do
              test -s "$mnt/$f" || { echo "$img: boot partition is missing $f" >&2; rc=1; }
            done
            if [[ "$ptable" == dos ]]; then
              test -s "$mnt/dtb.img" || { echo "$img: boot partition is missing dtb.img" >&2; rc=1; }
            fi
            grep -q 'rdinit=/rgos-init' "$mnt/extlinux/extlinux.conf" || cmp -s "$mnt/extlinux/extlinux.conf" "$mnt/extlinux/extlinux.conf.stock" \
              || { echo "$img: extlinux.conf has no rdinit=/rgos-init and is not the stock one" >&2; rc=1; }
            sudo umount "$mnt"; sudo losetup -d "$loop"
            (( rc == 0 )) && echo "Validated $img: label RGOS, $ptable partition table, SYSTEM + initramfs present."
            return $rc
          }
          case "${{ inputs.device }}" in
            rg34xxsp)  verify out/rg34xxsp-rgos.img dos ;;
            rg35xxh)   verify out/rg35xxh-rgos.img dos ;;
            rg35xxsp)  verify out/rg35xxsp-rgos.img dos ;;
            rg-rotate) verify out/rg-rotate-rgos.img gpt ;;
            all)       verify out/rg-rotate-rgos.img gpt; verify out/rg34xxsp-rgos.img dos; verify out/rg35xxh-rgos.img dos; verify out/rg35xxsp-rgos.img dos ;;
          esac

      - name: Verify PortMaster runtime libraries
        if: inputs.artifact == 'img' && inputs.portmaster
        env:
          ARTIFACT: ${{ inputs.artifact }}
          BUILD_ID: ${{ steps.metadata.outputs.build_id }}
        run: |
          set -euo pipefail
          check_system() {
            local sys="$1" label="$2" listing
            listing="$(unsquashfs -l "$sys")"
            grep -q 'libopenal\.so\.1$' <<<"$listing" || { echo "$label: SYSTEM has no libopenal.so.1: PortMaster would fail with 'error while loading shared libraries'" >&2; return 1; }
            grep -q 'opt/rgos/seed/PortMaster/PortMaster\.sh$' <<<"$listing" || { echo "$label: SYSTEM has no PortMaster seed" >&2; return 1; }
            echo "Validated $label: libopenal.so.1 and the PortMaster seed are in SYSTEM."
          }
          if [[ "$ARTIFACT" == img ]]; then
            for img in out/*-rgos.img; do
              loop="$(sudo losetup -Pfr --show "$img")"
              mnt="$(mktemp -d)"
              sudo partprobe "$loop" 2>/dev/null || true
              for _ in 1 2 3 4 5; do [[ -b "${loop}p1" ]] && break; sleep 1; done
              sudo mount -o ro "${loop}p1" "$mnt"
              rc=0; check_system "$mnt/SYSTEM" "$img" || rc=$?
              sudo umount "$mnt"; sudo losetup -d "$loop"
              (( rc == 0 )) || exit 1
            done
          else
            for tar in out/rgos-update-*-"$BUILD_ID".tar; do
              tmp="$(mktemp)"
              tar -xOf "$tar" boot/SYSTEM > "$tmp"
              rc=0; check_system "$tmp" "$tar" || rc=$?
              rm -f "$tmp"
              (( rc == 0 )) || exit 1
            done
          fi

      - name: Compress disk image
        if: inputs.artifact == 'img'
        working-directory: out
        run: |
          sudo gzip -6 -f ./*-rgos.img
          ls -la ./*-rgos.img.gz

      - name: Build installer image
        if: inputs.artifact == 'installer'
        env:
          DEVICE: ${{ inputs.device }}
          BUILD_ID: ${{ steps.metadata.outputs.build_id }}
          BUILD_PSX: ${{ inputs.build_psx }}
          BUILD_GC: ${{ inputs.build_gc }}
          ROCKNIX_URL_INPUT: ${{ inputs.rocknix_url }}
          H700_RAM_INPUT: ${{ inputs.h700_ram }}
          H700_PANEL_INPUT: ${{ inputs.h700_panel }}
          PORTMASTER_INPUT: ${{ inputs.portmaster }}
          EXTRA_PKGS_INPUT: ${{ inputs.extra_pkgs }}
        run: |
          set -euo pipefail
          export UPDATE_ID="$BUILD_ID"
          [[ "$PORTMASTER_INPUT" == "true" ]] && export PORTMASTER=1 || export PORTMASTER=0
          [[ -z "$EXTRA_PKGS_INPUT" ]] || export EXTRA_PKGS="$EXTRA_PKGS_INPUT"
          [[ "$BUILD_PSX" == "true" ]] || export PSX_REPO=none
          [[ "$BUILD_GC" == "true" ]] || export GC_REPO=none
          [[ -z "$ROCKNIX_URL_INPUT" ]] || export ROCKNIX_URL="$ROCKNIX_URL_INPUT"
          export H700_RAM="$H700_RAM_INPUT"
          if [[ "$H700_PANEL_INPUT" == "alt" ]]; then
            export RG34XXSP_DTB=sun50i-h700-anbernic-rg34xx-sp-v2-panel
            export RG35XXH_DTB=sun50i-h700-anbernic-rg35xx-h-rev6-panel
            export RG35XXSP_DTB=sun50i-h700-anbernic-rg35xx-sp-rev6-panel
          fi
          bash ./build.sh "$DEVICE" installer
          if [[ "$DEVICE" == "all" ]]; then
            for d in rg-rotate rg34xxsp rg35xxh rg35xxsp; do test -s "out/$d-rgos-installer.img"; done
          else
            test -s "out/$DEVICE-rgos-installer.img"
          fi

      - name: Verify installer image
        if: inputs.artifact == 'installer'
        run: |
          set -euo pipefail
          for img in out/*-rgos-installer.img; do
            loop="$(sudo losetup -Pfr --show "$img")"
            mnt="$(mktemp -d)"
            sudo partprobe "$loop" 2>/dev/null || true
            for _ in 1 2 3 4 5; do [[ -b "${loop}p1" ]] && break; sleep 1; done
            sudo mount -o ro "${loop}p1" "$mnt"
            rc=0
            for f in SYSTEM rgos-initrd.cpio rgos-payload/manifest.json; do
              test -s "$mnt/$f" || { echo "$img: boot partition is missing $f" >&2; rc=1; }
            done
            test ! -e "$mnt/rgos-installed.json" || { echo "$img: already marked as installed" >&2; rc=1; }
            python3 - "$mnt/rgos-payload" <<'PY' || rc=1
          import hashlib, json, os, sys
          d = sys.argv[1]
          man = json.load(open(os.path.join(d, 'manifest.json')))
          assert man['format'] == 1 and man['components'], 'empty manifest'
          for c in man['components']:
              h = hashlib.sha256()
              with open(os.path.join(d, c['archive']), 'rb') as f:
                  for b in iter(lambda: f.read(1 << 20), b''):
                      h.update(b)
              assert h.hexdigest() == c['sha256'], c['id'] + ': SHA-256 mismatch'
          print('payload ok:', ', '.join(c['id'] for c in man['components']))
          PY
            listing="$(unsquashfs -l "$mnt/SYSTEM")"
            grep -q 'opt/rgos/rgos-installer$' <<<"$listing" || { echo "$img: SYSTEM has no rgos-installer" >&2; rc=1; }
            grep -q 'libopenal\.so\.1$' <<<"$listing" || { echo "$img: SYSTEM has no libopenal.so.1 (PortMaster would not start)" >&2; rc=1; }
            sudo umount "$mnt"; sudo losetup -d "$loop"
            (( rc == 0 )) || exit 1
            echo "Validated $img"
          done

      - name: Compress installer image
        if: inputs.artifact == 'installer'
        working-directory: out
        run: |
          sudo gzip -6 -f ./*-rgos-installer.img
          ls -la ./*-rgos-installer.img.gz

      - name: Build update tar
        if: inputs.artifact == 'update-tar'
        env:
          DEVICE: ${{ inputs.device }}
          UPDATE_ID: ${{ steps.metadata.outputs.build_id }}
          BUILD_PSX: ${{ inputs.build_psx }}
          BUILD_GC: ${{ inputs.build_gc }}
          INCLUDE_EXTLINUX: ${{ inputs.update_extlinux }}
          ROCKNIX_URL_INPUT: ${{ inputs.rocknix_url }}
          H700_RAM_INPUT: ${{ inputs.h700_ram }}
          H700_PANEL_INPUT: ${{ inputs.h700_panel }}
          PORTMASTER_INPUT: ${{ inputs.portmaster }}
          EXTRA_PKGS_INPUT: ${{ inputs.extra_pkgs }}
        run: |
          set -euo pipefail
          [[ "$PORTMASTER_INPUT" == "true" ]] && export PORTMASTER=1 || export PORTMASTER=0
          [[ -z "$EXTRA_PKGS_INPUT" ]] || export EXTRA_PKGS="$EXTRA_PKGS_INPUT"
          [[ "$BUILD_PSX" == "true" ]] || export PSX_REPO=none
          [[ "$BUILD_GC" == "true" ]] || export GC_REPO=none
          [[ "$INCLUDE_EXTLINUX" != "true" ]] || export UPDATE_EXTLINUX=1
          [[ -z "$ROCKNIX_URL_INPUT" ]] || export ROCKNIX_URL="$ROCKNIX_URL_INPUT"
          export H700_RAM="$H700_RAM_INPUT"
          if [[ "$H700_PANEL_INPUT" == "alt" ]]; then
            export RG34XXSP_DTB=sun50i-h700-anbernic-rg34xx-sp-v2-panel
            export RG35XXH_DTB=sun50i-h700-anbernic-rg35xx-h-rev6-panel
            export RG35XXSP_DTB=sun50i-h700-anbernic-rg35xx-sp-rev6-panel
          fi
          bash ./build.sh "$DEVICE" update
          if [[ "$DEVICE" == "all" ]]; then
            test -s "out/rgos-update-rg-rotate-${UPDATE_ID}.tar" && test -s "out/rgos-update-rg34xxsp-${UPDATE_ID}.tar" && test -s "out/rgos-update-rg35xxh-${UPDATE_ID}.tar" && test -s "out/rgos-update-rg35xxsp-${UPDATE_ID}.tar"
          else
            test -s "out/rgos-update-${DEVICE}-${UPDATE_ID}.tar"
          fi

      - name: Verify update archive
        if: inputs.artifact == 'update-tar'
        env:
          RGOS_BUILD_ID: ${{ steps.metadata.outputs.build_id }}
        run: |
          python3 - "$RGOS_BUILD_ID" out/rgos-update-*-"$RGOS_BUILD_ID".tar <<'PY'
          import hashlib, json, os, re, sys, tarfile
          build_id, paths = sys.argv[1], sys.argv[2:]
          if not paths:
              raise SystemExit('No update tar was produced')
          for path in paths:
              device = re.fullmatch(r'rgos-update-(.+)-' + re.escape(build_id) + r'\.tar', os.path.basename(path)).group(1)
              with tarfile.open(path, 'r:') as archive:
                  names = archive.getnames()
                  if 'manifest.json' not in names:
                      raise SystemExit(path + ': no manifest.json')
                  manifest = json.load(archive.extractfile('manifest.json'))
                  if manifest.get('id') != build_id:
                      raise SystemExit(path + ': manifest build ID mismatch')
                  if manifest.get('device') != device:
                      raise SystemExit(path + ': manifest device is not ' + device)
                  files = manifest.get('files', {})
                  for required in ('SYSTEM', 'rgos-initrd.cpio'):
                      if required not in files or 'boot/' + required not in names:
                          raise SystemExit(path + ': missing ' + required)
                  for name, digest in files.items():
                      member = archive.extractfile('boot/' + name)
                      if member is None:
                          raise SystemExit(path + ': manifest file missing from archive: ' + name)
                      h = hashlib.sha256()
                      for chunk in iter(lambda: member.read(1 << 20), b''):
                          h.update(chunk)
                      if h.hexdigest() != digest:
                          raise SystemExit(path + ': SHA-256 mismatch: ' + name)
              print('Validated update archive: ' + path)
          PY

      - name: Verify PortMaster runtime libraries
        if: inputs.artifact == 'update-tar' && inputs.portmaster
        env:
          ARTIFACT: ${{ inputs.artifact }}
          BUILD_ID: ${{ steps.metadata.outputs.build_id }}
        run: |
          set -euo pipefail
          check_system() {
            local sys="$1" label="$2" listing
            listing="$(unsquashfs -l "$sys")"
            grep -q 'libopenal\.so\.1$' <<<"$listing" || { echo "$label: SYSTEM has no libopenal.so.1: PortMaster would fail with 'error while loading shared libraries'" >&2; return 1; }
            grep -q 'opt/rgos/seed/PortMaster/PortMaster\.sh$' <<<"$listing" || { echo "$label: SYSTEM has no PortMaster seed" >&2; return 1; }
            echo "Validated $label: libopenal.so.1 and the PortMaster seed are in SYSTEM."
          }
          if [[ "$ARTIFACT" == img ]]; then
            for img in out/*-rgos.img; do
              loop="$(sudo losetup -Pfr --show "$img")"
              mnt="$(mktemp -d)"
              sudo partprobe "$loop" 2>/dev/null || true
              for _ in 1 2 3 4 5; do [[ -b "${loop}p1" ]] && break; sleep 1; done
              sudo mount -o ro "${loop}p1" "$mnt"
              rc=0; check_system "$mnt/SYSTEM" "$img" || rc=$?
              sudo umount "$mnt"; sudo losetup -d "$loop"
              (( rc == 0 )) || exit 1
            done
          else
            for tar in out/rgos-update-*-"$BUILD_ID".tar; do
              tmp="$(mktemp)"
              tar -xOf "$tar" boot/SYSTEM > "$tmp"
              rc=0; check_system "$tmp" "$tar" || rc=$?
              rm -f "$tmp"
              (( rc == 0 )) || exit 1
            done
          fi

      - name: Upload disk image
        if: inputs.artifact == 'img'
        uses: actions/upload-artifact@v4
        with:
          name: rgos-${{ inputs.device }}-${{ steps.metadata.outputs.build_id }}-img
          path: out/*-rgos.img.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload installer image
        if: inputs.artifact == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: rgos-${{ inputs.device }}-${{ steps.metadata.outputs.build_id }}-installer
          path: out/*-rgos-installer.img.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload update tar
        if: inputs.artifact == 'update-tar'
        uses: actions/upload-artifact@v4
        with:
          name: rgos-${{ inputs.device }}-${{ steps.metadata.outputs.build_id }}-update-tar
          path: out/rgos-update-*-${{ steps.metadata.outputs.build_id }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

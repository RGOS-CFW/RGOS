# Which version of each emulator core RG OS builds.
#
#   <CORE>_REF=<tag | branch | commit hash>      empty = the latest source of the repo (the default branch)
#
# Pin a core to a release tag or a full/short commit hash to get the same build every time; leave it empty to follow upstream.
# A pinned version that does not exist stops the build with an error, it never falls back to the latest source.
# An environment variable of the same name overrides this file for one build, e.g.  sudo N64_REF=v1.0 ./build.sh H700_DDR4
# Repos and make arguments are still set with <CORE>_REPO / *_MAKE_ARGS (see build.sh). The list of what was really built
# (core, repo, ref, commit) is written into the image as /etc/rgos/cores-built.txt and is also printed during the build.
#
# Cores that come from Debian packages (RetroArch, Gambatte, mGBA, Snes9x, Nestopia, WonderSwan) follow DEBIAN_SUITE instead.

NGP_REF=            # Neo Geo Pocket    (libretro/beetle-ngp-libretro)
GENESIS_REF=        # Mega Drive        (libretro/Genesis-Plus-GX)
PSX_REF=            # PlayStation       (libretro/pcsx_rearmed)
GC_REF=             # GameCube          (libretro/dolphin)
DC_REF=             # Dreamcast         (flyinghead/flycast; libretro core and standalone share it)
N64_REF=            # Nintendo 64       (libretro/mupen64plus-libretro-nx)
SATURN_REF=         # Saturn            (libretro/yabause; empty = latest of the yabasanshiro branch)
PICO8_REF=          # PICO-8            (jtothebell/fake-08)
PICO8_ALT_REF=      # PICO-8 alternative (libretro/retro8)
STELLA_REF=         # Atari 2600        (libretro/stella2014-libretro)
ATARI800_REF=       # Atari 5200        (libretro/libretro-atari800)
PROSYSTEM_REF=      # Atari 7800        (libretro/prosystem-libretro)
MAME2003_REF=       # Arcade            (libretro/mame2003-plus-libretro)
MAME_REF=           # full MAME         (libretro/mame, only built when named in build-cores.sh)

# RG35XX SP only (build.sh installs it as /etc/rgos/retroarch-rg35xxsp.cfg; rgos-launch appends it after the shared retroarch.cfg,
# before the per-launch run.cfg and the user's <ROMS>/config/retroarch.cfg, so both of those can still override it).
# This file is NOT shared with the RG34XXSP / RG35XX H: it has no stick binds on purpose.
#
# Hardware: Allwinner H700 clamshell, 640x480 (4:3) screen, D-pad, A/B/X/Y, L and R shoulder buttons, SELECT/START/MENU,
# volume +/- (handled by rgos-volume, not by RetroArch) and a lid switch. There are NO analog sticks (so no L3/R3 clicks) and no
# L2/R2 triggers. The input hub (rgos-input, "analog": false via /etc/rgos/input-rg35xxsp.json) merges the buttons into the
# single virtual pad "RG OS Gamepad" and publishes no axes at all.
#
# Buttons (joydev/SDL indices = the hub pad's evdev key codes in ascending order; the hub always advertises the full set, so the
# numbers are the same on every device even where a button does not exist):
#   0 B   1 A   2 X   3 Y   4 L   5 R   6 L2   7 R2   8 SELECT   9 START   10 MENU   11 L3   12 R3   13 up   14 down   15 left   16 right
# On this device 6, 7, 11 and 12 are never pressed.

# --- Video: native 640x480 panel ------------------------------------------------------------------------------------------------
video_fullscreen = "true"
video_fullscreen_x = "640"
video_fullscreen_y = "480"
video_windowed_fullscreen = "false"
video_rotation = "0"
video_vsync = "true"
video_smooth = "false"
# 4:3 panel: aspect follows the content automatically, scaled to fit (non-integer so 240p/160p systems fill the screen)
video_aspect_ratio_auto = "true"
video_scale_integer = "false"
menu_driver = "rgui"
rgui_aspect_ratio_lock = "0"
menu_rgui_shadows = "false"

# --- RetroPad (player 1) -------------------------------------------------------------------------------------------------------
input_player1_b_btn = "0"
input_player1_a_btn = "1"
input_player1_x_btn = "2"
input_player1_y_btn = "3"
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_l2_btn = "6"
input_player1_r2_btn = "7"
input_player1_select_btn = "8"
input_player1_start_btn = "9"
input_player1_up_btn = "13"
input_player1_down_btn = "14"
input_player1_left_btn = "15"
input_player1_right_btn = "16"

# --- No analog sticks ---------------------------------------------------------------------------------------------------------
# The stick clicks and every stick axis are explicitly unbound, so nothing can be read from a stick that does not exist. The
# D-pad stays four buttons (input_analog_dpad_mode 0: the D-pad does not pretend to be a stick, and a stick does not pretend to be a D-pad).
input_player1_l3_btn = "nul"
input_player1_r3_btn = "nul"
input_player1_l_x_plus_axis = "nul"
input_player1_l_x_minus_axis = "nul"
input_player1_l_y_plus_axis = "nul"
input_player1_l_y_minus_axis = "nul"
input_player1_r_x_plus_axis = "nul"
input_player1_r_x_minus_axis = "nul"
input_player1_r_y_plus_axis = "nul"
input_player1_r_y_minus_axis = "nul"
input_player1_l2_axis = "nul"
input_player1_r2_axis = "nul"
input_player1_r3_axis = "nul"
input_analog_dpad_mode = "0"

# --- Hotkeys: hold MENU (10), then press -----------------------------------------------------------------------------------------
# There are no L2/R2 here, so fast-forward and rewind sit on the D-pad instead of on the triggers.
#   MENU + START   leave the game (back to the RG OS launcher)
#   MENU + SELECT  RetroArch menu (press again to close it)
#   MENU + R       save state            MENU + L       load state
#   MENU + RIGHT   next state slot       MENU + LEFT    previous state slot
#   MENU + UP      fast-forward (hold)   MENU + DOWN    rewind (hold; only works where rewind_enable is on)
#   MENU + A       pause / resume        MENU + X       screenshot
# Volume is not a hotkey: the hardware volume buttons are handled system-wide by rgos-volume.
input_enable_hotkey_btn = "10"
input_exit_emulator_btn = "9"
input_menu_toggle_btn = "8"
input_save_state_btn = "5"
input_load_state_btn = "4"
input_state_slot_increase_btn = "16"
input_state_slot_decrease_btn = "15"
input_hold_fast_forward_btn = "13"
input_rewind_btn = "14"
input_pause_toggle_btn = "1"
input_screenshot_btn = "2"
